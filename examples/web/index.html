<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="LuciaJS: a Bun-native UI framework with single-file components, stores and scoped SCSS." />
    <title>LuciaJS</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpolygon points='8,22 10,5 20,15' fill='%23ffb7d5'/%3E%3Cpolygon points='40,22 38,5 28,15' fill='%23ffb7d5'/%3E%3Ccircle cx='24' cy='28' r='16' fill='%23ffb7d5'/%3E%3Ccircle cx='18' cy='27' r='2.2' fill='%233a2e4a'/%3E%3Ccircle cx='30' cy='27' r='2.2' fill='%233a2e4a'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <style>
      /* First paint only: main.ts swaps this for the Loader component. Keep the colors in sync with _theme.scss. */
      html { scrollbar-gutter: stable; }
      html.is-loading { overflow: hidden; }
      .loader-static { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: #fdfaff; color: #3a2e4a; font-family: "M PLUS Rounded 1c", system-ui, sans-serif; }
      html[data-theme="dark"] .loader-static { background: #0b0b0b; color: #f2f2f2; }
      .loader-static .loader-inner { display: grid; justify-items: center; gap: 0.9rem; }
      .loader-static .mark { width: 5rem; height: 5rem; animation: loader-mark 700ms ease-in-out infinite alternate; }
      .loader-static .name { margin: 0; font-size: 1.4rem; font-weight: 800; }
      .loader-static .dots { display: flex; gap: 0.45rem; }
      .loader-static .dot { width: 0.55rem; height: 0.55rem; border-radius: 50%; animation: loader-dot 500ms ease-in-out infinite alternate; }
      .loader-static .dot:nth-child(2) { animation-delay: 120ms; }
      .loader-static .dot:nth-child(3) { animation-delay: 240ms; }
      .loader-static .dot:nth-child(1) { background: #ffb7d5; }
      .loader-static .dot:nth-child(2) { background: #c9b6ff; }
      .loader-static .dot:nth-child(3) { background: #aef0d8; }
      html[data-theme="dark"] .loader-static .dot:nth-child(1) { background: #ff8fc7; }
      html[data-theme="dark"] .loader-static .dot:nth-child(2) { background: #b9a4ff; }
      html[data-theme="dark"] .loader-static .dot:nth-child(3) { background: #7ef0c8; }
      @keyframes loader-mark { to { transform: translateY(-10px) rotate(6deg); } }
      @keyframes loader-dot { to { transform: translateY(-8px); } }
      @media (prefers-reduced-motion: reduce) { .loader-static * { animation: none !important; } }
    </style>
    <script>
      // Runs before first paint: sets the theme, marks JS as on and locks the page scroll until the app is ready.
      document.documentElement.classList.add("js", "is-loading");
      var stored = null;
      try {
        stored = localStorage.getItem("lucia-web-theme");
      } catch (error) {}
      var dark = stored ? stored === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    </script>
  </head>
  <body>
    <div id="loader" class="loader-static" role="status" aria-label="Loading LuciaJS">
      <div class="loader-inner">
        <svg class="mark" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
          <polygon points="8,22 10,5 20,15" fill="#ffb7d5" />
          <polygon points="40,22 38,5 28,15" fill="#ffb7d5" />
          <circle cx="24" cy="28" r="16" fill="#ffb7d5" />
          <circle cx="18" cy="27" r="2.2" fill="currentColor" />
          <circle cx="30" cy="27" r="2.2" fill="currentColor" />
          <circle cx="13" cy="33" r="2.6" fill="#c9b6ff" />
          <circle cx="35" cy="33" r="2.6" fill="#c9b6ff" />
          <path d="M21 33 Q24 36 27 33" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" />
        </svg>
        <p class="name">LuciaJS</p>
        <div class="dots" aria-hidden="true"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
      </div>
    </div>
    <header class="topbar">
      <button class="icon-button menu-button" id="menu" type="button" aria-label="Open the docs menu" aria-controls="sidebar" aria-expanded="false">
        <span class="material-symbols-rounded" aria-hidden="true">menu</span>
      </button>
      <a class="brand" href="/">
        <svg class="logo-mark" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
          <polygon points="8,22 10,5 20,15" fill="var(--pink)" />
          <polygon points="40,22 38,5 28,15" fill="var(--pink)" />
          <circle cx="24" cy="28" r="16" fill="var(--pink)" />
          <circle cx="18" cy="27" r="2.2" fill="var(--fg)" />
          <circle cx="30" cy="27" r="2.2" fill="var(--fg)" />
          <circle cx="13" cy="33" r="2.6" fill="var(--lavender)" />
          <circle cx="35" cy="33" r="2.6" fill="var(--lavender)" />
          <path d="M21 33 Q24 36 27 33" stroke="var(--fg)" stroke-width="1.6" fill="none" stroke-linecap="round" />
        </svg>
        LuciaJS
      </a>
      <nav class="main-menu" aria-label="Main">
        <a href="/">Home</a>
        <a href="/guide">Guide</a>
        <a href="/reference">Reference</a>
      </nav>
      <div class="search">
        <span class="material-symbols-rounded" aria-hidden="true">search</span>
        <input id="search" type="search" placeholder="Search the docs" aria-label="Search the docs" autocomplete="off" />
      </div>
      <div class="topbar-actions">
        <div id="theme-slot"></div>
        <a class="icon-button" href="#" aria-label="GitHub repository">
          <span class="material-symbols-rounded" aria-hidden="true">code</span>
        </a>
      </div>
    </header>

    <div id="outlet"></div>

    <footer class="site-footer">
      <p class="footer-brand">
        <svg class="logo-mark" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
          <polygon points="8,22 10,5 20,15" fill="var(--pink)" />
          <polygon points="40,22 38,5 28,15" fill="var(--pink)" />
          <circle cx="24" cy="28" r="16" fill="var(--pink)" />
          <circle cx="18" cy="27" r="2.2" fill="var(--fg)" />
          <circle cx="30" cy="27" r="2.2" fill="var(--fg)" />
        </svg>
        LuciaJS
      </p>
      <nav aria-label="Footer">
        <a href="/">Home</a>
        <a href="/guide">Guide</a>
        <a href="/reference">Reference</a>
        <a href="#">GitHub</a>
      </nav>
    </footer>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
